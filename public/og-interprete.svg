<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Interprete.</title>
  <desc id="desc">Prática Baseada em Evidências, leitura crítica e aplicação.</desc>
  <rect width="1200" height="630" fill="#F1EBE8"/>
  <rect width="390" height="630" fill="#8C1535"/>
  <image href="/brand/svg/wordmark-creme.svg" x="58" y="64" width="274" height="52" preserveAspectRatio="xMinYMid meet"/>
  <text x="58" y="282" fill="#F1EBE8" font-family="Georgia, serif" font-size="52" font-weight="700">Perguntar.</text>
  <text x="58" y="350" fill="#F1EBE8" font-family="Georgia, serif" font-size="52" font-weight="700">Interpretar.</text>
  <text x="58" y="418" fill="#F1EBE8" font-family="Georgia, serif" font-size="52" font-weight="700">Aplicar.</text>
  <text x="472" y="176" fill="#8C1535" font-family="Georgia, serif" font-size="62" font-weight="700">Prática Baseada</text>
